project:
  type: manuscript
  output-dir: "."

manuscript:
  article: index.qmd
  notebooks: 
    - notebook: notebooks/plots/plots.qmd  # plots
execute:
  echo: false
  warning: false
  message: false
  eval: true

format:
  html:
    number-sections: true
    number-depth: 3
    css: styles.css
    fig-path: _output/notebooks/plots
    comments:
      hypothesis: true
  docx: default
  pdf:
    title-block-style: none
    title: ""
    fig-format: pdf
    fig-dpi: 300
    number-sections: true
    number-depth: 3
    keep-tex: true
    cite-method: citeproc
    geometry:
      - bottom=24mm
      - includefoot
    include-in-header:
      text: |
        \makeatletter
        \renewcommand{\maketitle}{}
        \makeatother
        \setlength{\footskip}{18mm}
        \usepackage{float}
        \usepackage{caption}
        \usepackage{subcaption}
        \floatstyle{plain}
        \newfloat{suppfig}{htbp}{losf}
        \floatname{suppfig}{Supplementary Figure}
        \DeclareCaptionSubType{suppfig}
        \usepackage{placeins}
        \floatplacement{suppfig}{H}
        \captionsetup[figure]{format=plain,justification=raggedright,singlelinecheck=false}
        \captionsetup[table]{format=plain,justification=raggedright,singlelinecheck=false}
    notebook-links: false
  jats: default

editor: visual