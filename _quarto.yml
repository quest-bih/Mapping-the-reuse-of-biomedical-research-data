project:
  type: manuscript
  output-dir: "."

manuscript:
  article: index.qmd
  notebooks: 
    - notebook: notebooks/plots/plots.qmd  # plots

execute:
  echo: false
  warning: false
  message: false
  eval: true

format:
  html:
    css: styles.css
    fig-path: _output/notebooks/plots
    comments:
      hypothesis: true
  docx: default
  pdf:
    keep-tex: true
    cite-method: citeproc
    include-in-header:
      text: |
        \usepackage{float}
        \usepackage{caption}
        \usepackage{subcaption}
        \floatstyle{plain}
        \newfloat{suppfig}{htbp}{losf}
        \floatname{suppfig}{Supplementary Figure}
        \DeclareCaptionSubType{suppfig}
  jats: default

editor: visual