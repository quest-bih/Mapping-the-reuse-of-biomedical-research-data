project:
  type: manuscript
  output-dir: _output

manuscript:
  article: index.qmd
  notebooks: 
    - notebook: notebooks/quick_run.qmd
#  - notebook: notebooks/plots/plots.qmd  # plots
#  - notebook: notebooks/preprocessing/charite/charite_loading_and_preprocessing.qmd # charite preprocessing
#  - notebook: notebooks/preprocessing/dcc/dcc_loading_and_preprocessing.qmd # dcc preprocessing

execute:
  freeze: false
  echo: false  # Hide ALL code chunks
  cache: false
  keep-figures: true  # Ensure figures persist

format:
  html:
    comments:
      hypothesis: true
  docx: default
  pdf: default
  jats: default

editor: visual

